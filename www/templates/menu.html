<ion-side-menus ng-controller="MenuCtrl">

  <ion-side-menu-content>
    <ion-nav-bar class="bar-positive">
      <ion-nav-buttons side="left">
        <button class="button button-icon icon ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="conteudo"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left">
    <header class="bar bar-header cabecalho-menu">
      <div>
        <h2 class="nome-aluno">{{ aluno.nome }}</h2>
        <p class="matricula-aluno">RA {{ aluno.matricula }}</p>
      </div>
    </header>

    <ion-content class="has-header conteudo-menu">
      <a class="item item-icon-left" href="#/app/mural" menu-close>
        <i class="icon ion-ios-paper"></i> Mural
      </a>
      <a class="item item-icon-left" href="#/app/perfil" menu-close>
        <i class="icon ion-person"></i> Meus Dados
      </a>
      <a class="item item-icon-left" href="#/app/financeiro" menu-close>
        <i class="icon ion-cash"></i> Financeiro
      </a>
      <a class="item item-icon-left item-sair" ng-click="sair()" menu-close>
        <i class="icon ion-log-out"></i> Sair
      </a>
    </ion-content>
  </ion-side-menu>

</ion-side-menus>
